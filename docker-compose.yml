version: "3.9"

services:
  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - INFANTIA_DATABASE_URL=postgresql://infantia:changeme@db:5432/infantia
      - INFANTIA_SECRET_KEY=change-me-in-production
      - INFANTIA_DEBUG=false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infantia
      POSTGRES_USER: infantia
      POSTGRES_PASSWORD: changeme
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infantia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
